version: 1

# These cards define experimental needs before selecting concrete Wikidata
# examples. A card is only a candidate until its data realization, gold answer,
# and claimed difficulty have been verified.
#
# They are coverage targets, not prompt templates. Concrete relations,
# semantic evidence, decisive languages and wording are inferred from the data
# and stored in the task certificate. They must not leak into the question.
cards:
  - id: LT_RETRIEVE_ALL_INTERSECTION_VOLUME
    execution_target: {pattern: LT}
    objective: {type: retrieve, coverage: all}
    candidate_set: {operation: intersection}
    modifiers: {volume: high, cross_lingual: false, obscurity: medium}
    difficulty_sources: [volume, exhaustive_coverage, logical_composition]

  - id: LT_RETRIEVE_ALL_DIFFERENCE_OBSCURE
    execution_target: {pattern: LT}
    objective: {type: retrieve, coverage: all}
    candidate_set: {operation: difference}
    modifiers: {volume: medium, cross_lingual: false, obscurity: high}
    difficulty_sources: [obscurity, exhaustive_coverage]

  - id: LT_AUDIT_CONFLICT_POOL_VOLUME
